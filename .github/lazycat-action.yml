version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/candy.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: cacao
    bump: patch
build:
  run_buildscript: false
images:
  - id: cacao
    target: service
    service: cacao
    source: lanthora/cacao
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Candy
    summary: "WebUI 版的 Candy(一个高可用、低时延、反审查的组网工具)服务器"
